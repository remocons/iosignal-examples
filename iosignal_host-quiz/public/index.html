<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IOSignal Host Quiz</title>
  <link rel="stylesheet" href="style.css">
  <script src="vendor/io.js"></script>
</head>
<body>
  <header>
    <h1>IOSignal Host Quiz</h1>
    <div class="status">
      <span id="state" class="pill">connecting</span>
      <span>내 CID <code id="cid">-</code></span>
    </div>
  </header>

  <main>
    <section id="join" class="card">
      <h2>입장</h2>
      <p class="muted">문제와 채점은 서버 안의 호스트(<code>server.host('quiz')</code>)가 맡습니다. 여러 창에서 열어 함께 풀어 보세요.</p>
      <form id="joinForm">
        <input id="name" maxlength="12" placeholder="닉네임 (최대 12자)" autocomplete="off">
        <button type="submit">입장하기</button>
      </form>
    </section>

    <section id="quiz" class="card" hidden>
      <div class="qhead">
        <span id="qno" class="muted">-</span>
        <span id="timer" class="timer">-</span>
      </div>
      <div class="bar"><div id="bar"></div></div>
      <h2 id="qtext">대기 중…</h2>
      <div id="choices" class="choices"></div>
      <p id="mine" class="mine" hidden></p>
    </section>

    <section class="card">
      <h2>점수판 <small class="muted">quiz#$state</small></h2>
      <ol id="board" class="board"></ol>
    </section>

    <section class="card">
      <h2>위조해 보기</h2>
      <p class="muted">클라이언트가 할 수 있는 부정행위를 직접 보내 봅니다. 서버 로그와 <a href="healthz" target="_blank">healthz</a>의 카운터도 확인하세요.</p>
      <div class="row">
        <button id="fakeBoard" class="ghost">점수판 위조 보내기</button>
        <button id="fakeCid" class="ghost">다른 사람 CID로 답하기</button>
      </div>
      <ul id="log" class="log"></ul>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
