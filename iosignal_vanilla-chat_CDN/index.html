<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanilla JS Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="App">
        <a id="home-link" class="home-link" hidden>← 예제 목록</a>
        <h1>IOSignal Vanilla JS Chat Example : via CDN</h1>
        <div>URL: <span id="url"></span></div>
        <div>Channel: <span id="channel"></span></div>
        <div>IO State: <span id="io-state" role="status">connecting</span></div>
        <div>Client ID: <span id="cid"></span></div>
        <div id="messages" class="messages" role="log" aria-label="Chat messages" tabindex="0"></div>
        <div class="input-area">
            <input type="text" id="input" aria-label="Message" disabled />
            <button id="send-button" disabled>Send</button>
        </div>
        <footer class="site-footer"><a href="https://iosignal.net/">IOSignal 문서 iosignal.net ↗</a></footer>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
